spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/castel_dev
    username: castel
    password: castel

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Placeholder de configuracao para seed de dados de exemplo em desenvolvimento.
# A carga efetiva do seed sera implementada quando houver entidade de dominio.
castel:
  dev:
    seed-enabled: true
