spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/castel_dev
    username: castel
    password: castel

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG

# Seed de usuarios de desenvolvimento (admin, recepcao, garcom, cozinha, inativo).
# A senha e a mesma para todos e so tem valor padrao neste perfil.
castel:
  dev:
    seed-enabled: true
    seed-password: ${DEV_SEED_PASSWORD:admin123}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-secret-please-change-me-1234567890}
  cors:
    allowed-origins:
      - "*"
