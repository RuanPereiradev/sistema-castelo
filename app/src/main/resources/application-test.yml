spring:
  # Datasource is provided dynamically by Testcontainers (task 0.3).
  # No hardcoded JDBC url on this profile.

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: true

  web:
    cors:
      allowed-origins: []

logging:
  level:
    org.hibernate.SQL: WARN
