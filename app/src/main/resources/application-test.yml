spring:
  # Datasource is provided dynamically by Testcontainers (task 0.3).
  # No hardcoded JDBC url on this profile.

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: true

logging:
  level:
    org.hibernate.SQL: WARN

castel:
  restaurant:
    # A tarefa que expira os pedidos do QR da mesa fica desligada nos testes de integracao: uma
    # rodada dela no meio de um teste o tornaria instavel. A expiracao e chamada direto no teste.
    table-order-request-expiry-enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-secret-please-change-me-1234567890}
  cors:
    allowed-origins: []
