spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: true

  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.hibernate.SQL: WARN
